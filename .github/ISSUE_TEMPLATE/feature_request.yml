name: 功能建议
description: 提出一个具体的使用场景和改进建议。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 请描述使用场景，不要附带真实人脸或工作内容。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议怎么改？
      description: 说明你希望看到的行为，以及已有方案不方便的地方。
    validations:
      required: true
